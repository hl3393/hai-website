<!DOCTYPE html>
<!--
  LAYOUT TEMPLATE — wraps every page of the site.
  Words in {{DOUBLE_BRACES}} are filled in automatically by build.js.
  Menu labels and footer wording live in site.json.
-->
<html lang="{{HTML_LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{FULL_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="alternate" hreflang="en" href="{{URL_EN}}">
  <link rel="alternate" hreflang="zh-Hans" href="{{URL_ZH}}">
  <link rel="alternate" hreflang="x-default" href="{{URL_EN}}">
  <meta property="og:title" content="{{FULL_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <script>
{{SUN_SCRIPT}}
  </script>
  <link rel="icon" href="{{ROOT}}assets/images/{{FAVICON}}" type="image/svg+xml">
  <link rel="icon" href="{{ROOT}}assets/images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="{{ROOT}}assets/images/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="{{ROOT}}assets/images/favicon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="{{ROOT}}assets/images/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="{{ROOT}}assets/css/style.css">
  <link rel="stylesheet" href="{{ROOT}}assets/css/fields.css">
  <script src="{{ROOT}}assets/js/main.js" defer></script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <a class="skip-link" href="#main">{{SKIP}}</a>

  <!-- Top bar: today (date, solar term, moon, weather, sun) and Appearance.
       Filled in by assets/js/main.js; hidden when JavaScript is off. -->
  <div class="topbar is-compact" data-today data-sunrise="{{SUNRISE}}" data-sunset="{{SUNSET}}" data-yours="{{YOUR_LOCATION}}">
    <div class="container topbar-inner">
      <p class="topbar-left">
        <span class="tb-item" data-today-date></span>
        <span class="tb-item tb-wide" data-today-term></span>
        <span class="tb-item today-moon"><span data-today-moon-icon></span><span class="tb-moon-name" data-today-moon-name></span></span>
      </p>
      <div class="topbar-right">
        <button type="button" class="tb-toggle today-toggle" aria-expanded="false" aria-controls="today-panel">{{TODAY_LABEL}}<svg class="chevron" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <div class="today-panel" id="today-panel">
          <span class="tb-item" data-today-place hidden></span>
          <span class="tb-item" data-today-sun hidden></span>
          <span class="tb-item"><button type="button" class="text-btn" data-locate data-label-on="{{LOCATE_OFF}}" data-label-off="{{LOCATE_ON}}">{{LOCATE_ON}}</button></span>
          <span class="tb-item tb-narrow-only" data-today-term></span>
          <span class="tb-item tb-narrow-only" data-today-moon-name></span>
        </div>
        <div class="theme-switch">
          <button type="button" class="tb-toggle theme-toggle" aria-expanded="false" aria-controls="theme-menu" aria-label="{{THEME_LABEL}}">
            <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="3" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10.5 2.2A6 6 0 1 0 13.8 10 4.8 4.8 0 0 1 10.5 2.2Z" fill="currentColor"/></svg>
          </button>
          <div class="theme-switch-group" id="theme-menu" role="group" aria-label="{{THEME_LABEL}}">
            <button type="button" class="theme-btn" data-theme-choice="auto" aria-pressed="true" title="{{THEME_AUTO_TITLE}}">{{THEME_AUTO}}</button>
            <button type="button" class="theme-btn" data-theme-choice="light" aria-pressed="false">{{THEME_LIGHT}}</button>
            <button type="button" class="theme-btn" data-theme-choice="dark" aria-pressed="false">{{THEME_DARK}}</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{HOME_HREF}}">{{BRAND_LOGO}}
        <span class="wordmark"><span lang="en">{{WORDMARK_EN}}</span><small lang="zh-Hans">{{WORDMARK_ZH}}</small></span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">{{MENU}}</button>
      <nav id="site-nav" class="site-nav" aria-label="{{NAV_LABEL}}">
        <ul>
{{NAV_ITEMS}}
          <li class="lang-switch"><a href="{{SWITCH_HREF}}" hreflang="{{OTHER_LANG}}" lang="{{OTHER_LANG}}" title="{{SWITCH_TITLE}}">{{SWITCH_LABEL}}</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
{{CONTENT}}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <p class="footer-name">{{SITE_NAME}}</p>
          <p>{{TAGLINE}}</p>
        </div>
        <div>
          <h2>{{FOOTER_EXPLORE}}</h2>
          <ul>
{{FOOTER_LINKS}}
          </ul>
        </div>
        <div>
          <h2>{{FOOTER_CONTACT}}</h2>
          <p><a href="mailto:{{EMAIL}}">{{EMAIL}}</a></p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>{{FOOTER_LEGAL}}</p>
        <p>&copy; <span data-current-year>{{YEAR}}</span> {{COPYRIGHT}}</p>
      </div>
    </div>
  </footer>
</body>
</html>
