<!DOCTYPE html>
<!--
  LAYOUT TEMPLATE — wraps every page of the site.
  Words in {{DOUBLE_BRACES}} are filled in automatically by build.js.
  Menu labels and footer wording live in site.json.
-->
<html lang="{{HTML_LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{FULL_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="alternate" hreflang="en" href="{{URL_EN}}">
  <link rel="alternate" hreflang="zh-Hans" href="{{URL_ZH}}">
  <link rel="alternate" hreflang="x-default" href="{{URL_EN}}">
  <meta property="og:title" content="{{FULL_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <script>
{{SUN_SCRIPT}}
  </script>
  <link rel="icon" href="{{ROOT}}assets/images/{{FAVICON}}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ROOT}}assets/css/style.css">
  <link rel="stylesheet" href="{{ROOT}}assets/css/fields.css">
  <script src="{{ROOT}}assets/js/main.js" defer></script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <a class="skip-link" href="#main">{{SKIP}}</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{HOME_HREF}}">{{BRAND_LOGO}}
        <span class="wordmark"><span lang="en">{{WORDMARK_EN}}</span><small lang="zh-Hans">{{WORDMARK_ZH}}</small></span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">{{MENU}}</button>
      <nav id="site-nav" class="site-nav" aria-label="{{NAV_LABEL}}">
        <ul>
{{NAV_ITEMS}}
          <li class="lang-switch"><a href="{{SWITCH_HREF}}" hreflang="{{OTHER_LANG}}" lang="{{OTHER_LANG}}" title="{{SWITCH_TITLE}}">{{SWITCH_LABEL}}</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
{{CONTENT}}
  </main>

  <footer class="site-footer">
    <!-- Today: date · city · weather · sun, filled in by main.js -->
    <div class="today" data-today data-sunrise="{{SUNRISE}}" data-sunset="{{SUNSET}}" data-yours="{{YOUR_LOCATION}}">
      <div class="container today-inner">
        <p class="today-info" aria-live="polite" style="margin:0">
          <span data-today-date></span>
          <span data-today-term></span>
          <span data-today-place hidden></span>
          <span data-today-sun hidden></span>
          <span data-today-moon class="today-moon"></span>
          <span><button type="button" class="text-btn" data-locate data-label-on="{{LOCATE_OFF}}" data-label-off="{{LOCATE_ON}}">{{LOCATE_ON}}</button></span>
        </p>
        <div class="theme-switch">
          <span class="theme-switch-label" id="theme-label">{{THEME_LABEL}}</span>
          <div class="theme-switch-group" role="group" aria-labelledby="theme-label">
            <button type="button" class="theme-btn" data-theme-choice="auto" aria-pressed="true" title="{{THEME_AUTO_TITLE}}">{{THEME_AUTO}}</button>
            <button type="button" class="theme-btn" data-theme-choice="light" aria-pressed="false">{{THEME_LIGHT}}</button>
            <button type="button" class="theme-btn" data-theme-choice="dark" aria-pressed="false">{{THEME_DARK}}</button>
          </div>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="footer-grid">
        <div>
          <p class="footer-name">{{SITE_NAME}}</p>
          <p>{{TAGLINE}}</p>
        </div>
        <div>
          <h2>{{FOOTER_EXPLORE}}</h2>
          <ul>
{{FOOTER_LINKS}}
          </ul>
        </div>
        <div>
          <h2>{{FOOTER_CONTACT}}</h2>
          <p><a href="mailto:{{EMAIL}}">{{EMAIL}}</a></p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>{{FOOTER_LEGAL}}</p>
        <p>&copy; <span data-current-year>{{YEAR}}</span> {{COPYRIGHT}}</p>
      </div>
    </div>
  </footer>
</body>
</html>
