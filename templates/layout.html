<!DOCTYPE html>
<!--
  LAYOUT TEMPLATE — wraps every page of the site.
  Words in {{DOUBLE_BRACES}} are filled in automatically by build.js.
  Menu labels and footer wording live in site.json.
-->
<html lang="{{HTML_LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{FULL_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="alternate" hreflang="en" href="{{URL_EN}}">
  <link rel="alternate" hreflang="zh-Hans" href="{{URL_ZH}}">
  <link rel="alternate" hreflang="x-default" href="{{URL_EN}}">
  <meta property="og:title" content="{{FULL_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <script>
    /* Time-of-day theme. Runs before the page is drawn, so the right
       colours appear immediately. Approximate sunrise / sunset hours for
       each month (January first), at mid-northern latitudes, local clock. */
    (function () {
      var SUN = [[7.3,17],[7,17.6],[7.1,19],[6.5,19.6],[5.8,20.1],[5.5,20.5],
                 [5.7,20.4],[6.2,19.9],[6.7,19.1],[7.2,18.3],[6.8,16.7],[7.2,16.5]];
      function sunTheme(d) {
        var s = SUN[d.getMonth()], h = d.getHours() + d.getMinutes() / 60;
        if (h >= s[0] - 1 && h < s[0] + 1.5) return "sunrise";
        if (h >= s[0] + 1.5 && h < s[1] - 1.5) return "day";
        if (h >= s[1] - 1.5 && h < s[1] + 1) return "sunset";
        return "night";
      }
      function choice() {
        try { var c = localStorage.getItem("hai-theme"); if (c === "light" || c === "dark") return c; } catch (e) {}
        return "auto";
      }
      function resolve() {
        var c = choice();
        if (c === "light") return "day";
        if (c === "dark") return "night";
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "night";
        return sunTheme(new Date());
      }
      function apply() { document.documentElement.setAttribute("data-theme", resolve()); }
      document.documentElement.className += " js";
      apply();
      window.haiTheme = { apply: apply, choice: choice };
    })();
  </script>
  <link rel="icon" href="{{ROOT}}assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ROOT}}assets/css/style.css">
  <link rel="stylesheet" href="{{ROOT}}assets/css/fields.css">
  <script src="{{ROOT}}assets/js/main.js" defer></script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <a class="skip-link" href="#main">{{SKIP}}</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{HOME_HREF}}">
        <img src="{{ROOT}}assets/images/logo.svg" alt="" width="40" height="40">
        <span>{{SITE_NAME}}<small lang="{{OTHER_LANG}}">{{SITE_NAME_OTHER}}</small></span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">{{MENU}}</button>
      <nav id="site-nav" class="site-nav" aria-label="{{NAV_LABEL}}">
        <ul>
{{NAV_ITEMS}}
          <li class="lang-switch"><a href="{{SWITCH_HREF}}" hreflang="{{OTHER_LANG}}" lang="{{OTHER_LANG}}" title="{{SWITCH_TITLE}}">{{SWITCH_LABEL}}</a></li>
          <li class="theme-switch">
            <div class="theme-switch-group" role="group" aria-label="{{THEME_LABEL}}">
              <button type="button" class="theme-btn" data-theme-choice="auto" aria-pressed="true" title="{{THEME_AUTO_TITLE}}">{{THEME_AUTO}}</button>
              <button type="button" class="theme-btn" data-theme-choice="light" aria-pressed="false">{{THEME_LIGHT}}</button>
              <button type="button" class="theme-btn" data-theme-choice="dark" aria-pressed="false">{{THEME_DARK}}</button>
            </div>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
{{CONTENT}}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <p class="footer-name">{{SITE_NAME}}</p>
          <p>{{TAGLINE}}</p>
        </div>
        <div>
          <h2>{{FOOTER_EXPLORE}}</h2>
          <ul>
{{FOOTER_LINKS}}
          </ul>
        </div>
        <div>
          <h2>{{FOOTER_CONTACT}}</h2>
          <p><a href="mailto:{{EMAIL}}">{{EMAIL}}</a></p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>{{FOOTER_LEGAL}}</p>
        <p>&copy; <span data-current-year>{{YEAR}}</span> {{COPYRIGHT}}</p>
      </div>
    </div>
  </footer>
</body>
</html>
